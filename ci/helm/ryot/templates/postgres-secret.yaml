{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
{{- /*
The bundled password is effectively immutable after first install: the official
postgres image only applies POSTGRES_PASSWORD when initializing an empty data
directory. Changing the chart value would update this Secret (and the app's
DATABASE_URL) while the running database keeps the old password, breaking the
app on its next restart. Guard against that by comparing with the live Secret
and failing the upgrade on a mismatch. `lookup` returns nothing during
`helm template`, client-side dry-runs, and unit tests, so the guard only
applies against a real cluster.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "ryot.postgres.fullname" .) }}
{{- if $existing }}
{{- $current := index $existing.data "postgres-password" | default "" | b64dec }}
{{- if and $current (ne $current .Values.postgres.auth.password) }}
{{- fail "postgres.auth.password differs from the value in the existing chart-managed secret. The bundled PostgreSQL only applies POSTGRES_PASSWORD on first initialization, so changing it here would break the database connection. Keep the original password, or rotate it inside PostgreSQL first (ALTER USER) and then update the secret manually." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ryot.postgres.fullname" . }}
  labels:
    {{- include "ryot.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  postgres-password: {{ .Values.postgres.auth.password | quote }}
{{- end }}
