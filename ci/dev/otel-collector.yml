receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  transform/truncate:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - truncate_all(attributes, 4096)

exporters:
  debug:
    verbosity: basic
  otlp_http/jaeger:
    endpoint: http://ryot-jaeger:4318
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [transform/truncate, batch]
      exporters: [otlp_http/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
