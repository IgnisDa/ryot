# TODO: delete this file eventually

services:
  ryot-redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      retries: 5
      timeout: 5s
      interval: 2s
      test: ["CMD", "redis-cli", "ping"]

  ryot-bull-board:
    restart: unless-stopped
    image: venatum/bull-board
    ports:
      - "3002:3000"
    environment:
      REDIS_HOST: ryot-redis
    depends_on:
      ryot-redis:
        condition: service_healthy

  ryot-postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    command: postgres -c shared_preload_libraries=pg_stat_statements -c wal_level=logical
    ports:
      - "5432:5432"
    volumes:
      - ryot_postgres_storage:/var/lib/postgresql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      retries: 5
      timeout: 5s
      interval: 2s
      test: ["CMD-SHELL", "pg_isready -U postgres"]

  ryot:
    restart: unless-stopped
    env_file:
      - tmp/.env
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ryot-redis:
        condition: service_healthy
      ryot-postgres:
        condition: service_healthy
    volumes:
      - ryot_local_storage:/home/ryot/storage
    tmpfs:
      - /home/ryot/work:uid=1001,gid=1001,mode=1770

volumes:
  ryot_postgres_storage:
  ryot_local_storage:
