apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ryot.fullname" . }}-test-database-url
  labels:
    {{- include "ryot.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: database-url
      # postgres image ships psql + pg_isready, and is already in use for the
      # bundled database.
      image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
      imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
      # Inject the EXACT same database environment the app receives, so this
      # proves the composed DATABASE_URL is well-formed and actually connects.
      env:
        {{- include "ryot.databaseEnv" . | nindent 8 }}
      command:
        - sh
        - -c
        - |
          set -e
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is empty" >&2
            exit 1
          fi
          # Log the URL with the password masked.
          masked=$(printf '%s' "$DATABASE_URL" | sed -E 's,//([^:]+):[^@]+@,//\1:****@,')
          echo "Resolved DATABASE_URL: $masked"
          # Must be a postgres connection string.
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) : ;;
            *) echo "DATABASE_URL is not a postgres connection string" >&2; exit 1 ;;
          esac
          echo "Waiting for the database to accept connections..."
          for i in $(seq 1 30); do
            if pg_isready -d "$DATABASE_URL" >/dev/null 2>&1; then
              break
            fi
            echo "attempt $i: not ready, retrying..."
            sleep 5
          done
          pg_isready -d "$DATABASE_URL"
          echo "Running a query through the composed URL..."
          psql "$DATABASE_URL" -At -c 'SELECT 1;' | grep -qx 1
          echo "DATABASE_URL is valid and the database is reachable"
