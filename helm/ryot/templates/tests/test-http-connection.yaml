apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ryot.fullname" . }}-test-http
  labels:
    {{- include "ryot.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: http
      image: {{ include "ryot.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - sh
        - -c
        - |
          set -e
          url="http://{{ include "ryot.fullname" . }}:{{ .Values.service.port }}/health"
          echo "GET $url"
          # Retry to allow the app to finish starting.
          for i in $(seq 1 30); do
            if curl -fsS -m 10 "$url" >/dev/null; then
              echo "Ryot /health OK"
              exit 0
            fi
            echo "attempt $i failed, retrying..."
            sleep 5
          done
          echo "Ryot /health did not become healthy in time" >&2
          exit 1
