name: Helm Test

on:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Install the chart (bundled PostgreSQL)
        # --wait blocks until the Deployment and StatefulSet are Ready, so the
        # subsequent `helm test` runs against a live, healthy release.
        run: |
          helm install ryot helm/ryot \
            --namespace ryot --create-namespace \
            --set secret.adminAccessToken.value=ci-admin-token \
            --set postgres.auth.password=ci-postgres-password \
            --set config.frontendUrl=http://ryot.ci.local \
            --wait --timeout 10m

      - name: Run helm test (http + DATABASE_URL connectivity)
        run: helm test ryot --namespace ryot --logs

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n ryot -o wide || true
          kubectl describe pods -n ryot || true
          kubectl logs -n ryot -l app.kubernetes.io/name=ryot --tail=200 --all-containers || true
          kubectl logs -n ryot -l app.kubernetes.io/component=database --tail=200 || true
