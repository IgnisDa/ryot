name: Main

on:
  push:
    branches: [main]
    tags:
      - "*-?v[0-9]+*"
    paths: &paths
      - "kernel/**"
      - "packages/**"
      - "plugins/**"
      - "apps/server/**"
      - "ci/oxlint/**"
      - "ci/helm/**"
      - ".github/workflows/helm-ci.yml"
      - "patches/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".oxlintrc.json"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "tsconfig*.json"
      - "turbo.json"
      - ".github/workflows/main.yml"
      - ".github/workflows/sandboxd.yml"
      - ".github/workflows/helm-release.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number to publish as pr-<number>; leave empty to publish main"
        type: string
        default: ""
      full-validation:
        description: "Run full sandbox/backend tests and Kubernetes acceptance before publishing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: main-${{ github.event_name == 'pull_request' && github.run_id || 'publication' }}
  queue: max

env:
  GHCR_REGISTRY: ghcr.io
  DOCKER_USERNAME: ignisda

jobs:
  pre-workflow-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source-ref: ${{ steps.set_outputs.outputs.source-ref }}
      pr-number: ${{ steps.set_outputs.outputs.pr-number }}
      publish: ${{ steps.set_outputs.outputs.publish }}
      image-names: ${{ steps.set_outputs.outputs.image-names }}
      image-repositories: ${{ steps.set_outputs.outputs.image-repositories }}
      should-release: ${{ steps.set_outputs.outputs.should-release }}
      run-tests: ${{ steps.set_outputs.outputs.run-tests }}
      run-kubernetes: ${{ steps.set_outputs.outputs.run-kubernetes }}
    steps:
      - name: Set outputs
        id: set_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          FULL_VALIDATION: ${{ inputs.full-validation }}
        with:
          script: |
            const repositoryName = context.payload.repository.name;
            const owner = context.repo.owner;
            const ghcrRegistry = process.env.GHCR_REGISTRY;
            const dockerUsername = process.env.DOCKER_USERNAME;

            const imageRepositories = [
              `${dockerUsername}/${repositoryName}`,
              `${ghcrRegistry}/${owner}/${repositoryName}`,
              `${dockerUsername}/${repositoryName}-pro`,
              `${ghcrRegistry}/${owner}/${repositoryName}-pro`,
            ].map((repository) => repository.toLowerCase());

            let sourceRef = context.sha;
            let prNumber = context.payload.pull_request?.number ?? '';
            if (context.eventName === 'workflow_dispatch') {
              const requestedPr = process.env.PR_NUMBER.trim();
              if (requestedPr) {
                if (!/^[1-9][0-9]*$/.test(requestedPr)) {
                  throw new Error('PR number must be a positive integer');
                }
                const { data: pr } = await github.rest.pulls.get({
                  ...context.repo,
                  pull_number: Number(requestedPr),
                });
                if (pr.state !== 'open' || pr.head.repo?.full_name !== context.payload.repository.full_name) {
                  throw new Error('Publishing requires an open PR from this repository');
                }
                sourceRef = pr.head.sha;
                prNumber = pr.number;
              } else if (context.ref !== `refs/heads/${context.payload.repository.default_branch}`) {
                throw new Error('Choose the default branch, or supply a PR number');
              }
            }
            core.setOutput('source-ref', sourceRef);
            core.setOutput('pr-number', prNumber);
            core.setOutput('publish', context.eventName !== 'pull_request');

            const shouldRelease = (context.eventName === "push" && context.ref.startsWith("refs/tags/")) ? 'true' : 'false';
            core.setOutput('should-release', shouldRelease);

            let runTests = true;
            let runKubernetes = true;
            if (context.eventName === 'workflow_dispatch') {
              runTests = runKubernetes = process.env.FULL_VALIDATION === 'true';
            } else if (shouldRelease !== 'true') {
              try {
                let files;
                if (context.eventName === 'pull_request') {
                  files = await github.paginate(github.rest.pulls.listFiles, {
                    ...context.repo,
                    pull_number: prNumber,
                    per_page: 100,
                  });
                  if (files.length >= 3000 || files.length !== context.payload.pull_request.changed_files) {
                    throw new Error('Incomplete PR file list');
                  }
                } else {
                  if (!context.payload.before || /^0+$/.test(context.payload.before) || context.payload.forced) {
                    throw new Error('Push has no reliable comparison base');
                  }
                  const { data } = await github.rest.repos.compareCommitsWithBasehead({
                    ...context.repo,
                    basehead: `${context.payload.before}...${context.sha}`,
                    per_page: 1,
                  });
                  files = data.files;
                  if (!files || files.length >= 300) throw new Error('Incomplete push file list');
                }
                const paths = files.flatMap(({ filename, previous_filename }) => [filename, previous_filename].filter(Boolean));
                const buildChanged = paths.some((path) => /^(Dockerfile|\.dockerignore|bun\.lock|bunfig\.toml|package\.json|tsconfig[^/]*\.json|turbo\.json)$|^patches\/|^\.github\/workflows\/(main|sandboxd)\.yml$/.test(path));
                runTests = buildChanged || paths.some((path) => /^(kernel\/(backend|sandbox)|apps\/server|packages|plugins|ci\/oxlint)\/|^\.oxlintrc\.json$/.test(path));
                runKubernetes = buildChanged || paths.some((path) => /^ci\/helm\/|^\.github\/workflows\/helm-(ci|release)\.yml$/.test(path));
              } catch (error) {
                core.warning(`Running full validation: ${error.message}`);
              }
            }
            core.setOutput('run-tests', runTests);
            core.setOutput('run-kubernetes', runKubernetes);
            core.info(`Full tests: ${runTests}; Kubernetes acceptance: ${runKubernetes}`);

            core.setOutput('image-names', imageRepositories.map((repository) => `name=${repository}`).join('\n'));
            core.setOutput('image-repositories', imageRepositories.join(','));

  validate-chart:
    uses: ./.github/workflows/helm-ci.yml

  validate-images:
    needs: [pre-workflow-checks, validate-chart]
    concurrency:
      group: image-validation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/sandboxd.yml
    with:
      source-ref: ${{ needs.pre-workflow-checks.outputs.source-ref }}
      image-repositories: ${{ needs.pre-workflow-checks.outputs.image-repositories }}
      publish: ${{ needs.pre-workflow-checks.outputs.publish == 'true' }}
      run-tests: ${{ needs.pre-workflow-checks.outputs.run-tests == 'true' }}
      run-kubernetes: ${{ needs.pre-workflow-checks.outputs.run-kubernetes == 'true' }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      UNKEY_ROOT_KEY: ${{ secrets.UNKEY_ROOT_KEY }}

  build-docker:
    needs:
      - pre-workflow-checks
      - validate-images
    if: needs.pre-workflow-checks.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to the ghcr container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to the docker hub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.pre-workflow-checks.outputs.image-names }}
          tags: |
            type=raw,value=pr-${{ needs.pre-workflow-checks.outputs.pr-number }},enable=${{ needs.pre-workflow-checks.outputs.pr-number != '' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/main' && needs.pre-workflow-checks.outputs.pr-number == '' }}
            type=semver,pattern=v{{version}},enable=${{ needs.pre-workflow-checks.outputs.should-release == 'true' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ needs.pre-workflow-checks.outputs.should-release == 'true' }}
            type=semver,pattern=v{{major}},enable=${{ needs.pre-workflow-checks.outputs.should-release == 'true' }}
            type=raw,value=latest,enable=${{ needs.pre-workflow-checks.outputs.should-release == 'true' }}
            type=sha,value=${{ needs.pre-workflow-checks.outputs.source-ref }}
      - name: Create manifest lists and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REPOSITORIES: ${{ needs.pre-workflow-checks.outputs.image-repositories }}
        run: |
          IFS=',' read -ra repositories <<< "${IMAGE_REPOSITORIES}"
          for repository in "${repositories[@]}"; do
            mapfile -t tags < <(jq -r --arg repository "${repository}" '.tags[] | select(startswith($repository + ":")) | "--tag=" + .' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
            sources=()
            for digest in *; do
              sources+=("${repository}@sha256:${digest}")
            done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          done

  prepare-release-artifacts:
    needs: pre-workflow-checks
    if: needs.pre-workflow-checks.outputs.publish == 'true' && needs.pre-workflow-checks.outputs.pr-number == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Cache Bun downloads
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Turbo artifacts
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .turbo/cache
          key: turbo-release-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: turbo-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build documentation and browser extensions
        run: bun run turbo build --filter=@ryot-app/docs --filter=@ryot-app/browser-extension
      - name: Build Kodi plugin
        if: needs.pre-workflow-checks.outputs.should-release == 'true'
        run: apps/kodi/ci/build-plugin.sh
      - name: Upload release assets
        if: needs.pre-workflow-checks.outputs.should-release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            apps/browser-extension/dist/*.zip
            tmp/script.ryot.zip
          if-no-files-found: error
          retention-days: 1
      - name: Upload documentation
        if: needs.pre-workflow-checks.outputs.should-release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: apps/docs/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  create-release:
    needs:
      - pre-workflow-checks
      - build-docker
      - prepare-release-artifacts
    if: needs.pre-workflow-checks.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@031a6408a9ad7fa6dcda49b7222ab2b54110a680 # v5.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}
          files: release-assets/**/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    needs:
      - pre-workflow-checks
      - create-release
    if: needs.pre-workflow-checks.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation
          path: documentation
      - name: Push to deployment branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: documentation
          publish_branch: nf-docs
          force_orphan: true

  publish-chart:
    needs:
      - pre-workflow-checks
      - create-release
    if: needs.pre-workflow-checks.outputs.should-release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-release.yml
    with:
      tag: ${{ github.ref_name }}
