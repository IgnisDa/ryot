name: Main Publication

on:
  push:
    branches: [main]
    tags:
      - "*-?v[0-9]+*"
  workflow_dispatch:
    inputs:
      full-validation:
        description: "Run full sandbox/backend tests and Kubernetes acceptance before publishing main"
        type: boolean
        default: false

permissions:
  contents: read

cache-mode: none

concurrency:
  group: main-publication
  queue: max

jobs:
  trusted-source:
    if: github.ref_protected && (github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref_type == 'tag'))
    runs-on: ubuntu-24.04
    steps:
      - if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Require the release commit to be on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

  validate:
    needs: trusted-source
    uses: ./.github/workflows/validate.yml
    with:
      full-validation: ${{ inputs.full-validation == true }}

  publish-images:
    needs: validate
    if: needs.validate.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the images built and validated in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ryot-image-${{ github.sha }}-*.tar
          merge-multiple: true
          path: ${{ runner.temp }}/images
          skip-decompress: true
      - name: Identify release repositories
        id: repositories
        run: |
          name="${GITHUB_REPOSITORY##*/}"
          host="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          repositories=("ignisda/${name,,}" "$host/${name,,}" "ignisda/${name,,}-pro" "$host/${name,,}-pro")
          printf 'names<<IMAGE_NAMES\n%s\nIMAGE_NAMES\n' "$(printf 'name=%s\n' "${repositories[@]}")" >> "$GITHUB_OUTPUT"
          IFS=,
          echo "IMAGE_REPOSITORIES=${repositories[*]}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Extract metadata for Docker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.repositories.outputs.names }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern=v{{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern=v{{major}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=sha-${{ env.SHORT_SHA }},priority=100
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.RELEASE_GHCR_USERNAME }}
          password: ${{ secrets.RELEASE_GHCR_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ignisda
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Publish the tested images by digest
        run: bash ci/images/promote.sh "$RUNNER_TEMP/images" "$GITHUB_SHA"

  prepare-release-artifacts:
    needs: trusted-source
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build documentation and browser extensions
        run: bun run turbo build --filter=@ryot-app/docs --filter=@ryot-app/browser-extension
      - name: Build Kodi plugin
        run: apps/kodi/ci/build-plugin.sh
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            apps/browser-extension/dist/*.zip
            tmp/script.ryot.zip
          if-no-files-found: error
          retention-days: 1
      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: apps/docs/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  create-release:
    needs:
      - publish-images
      - prepare-release-artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@031a6408a9ad7fa6dcda49b7222ab2b54110a680 # v5.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}
          files: release-assets/**/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    needs:
      - create-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation
          path: documentation
      - name: Push to deployment branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: documentation
          publish_branch: nf-docs
          force_orphan: true

  publish-chart:
    needs: create-release
    uses: ./.github/workflows/helm-release.yml
