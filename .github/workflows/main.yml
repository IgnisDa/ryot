name: Main

on:
  push:
    branches: ["main"]
    tags:
      - "*-?v[0-9]+*"
  pull_request:
    branches: ["main"]
    types: [opened, synchronize]

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  DOCKER_USERNAME: ignisda

jobs:
  pre-workflow-checks:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.set_outputs.outputs.should-run }}
      image-names: ${{ steps.set_outputs.outputs.image-names }}
      image-repositories: ${{ steps.set_outputs.outputs.image-repositories }}
      should-release: ${{ steps.set_outputs.outputs.should-release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set outputs
        id: set_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repositoryName = context.payload.repository.name;
            const owner = context.repo.owner;
            const ghcrRegistry = process.env.GHCR_REGISTRY;
            const dockerUsername = process.env.DOCKER_USERNAME;

            const imageRepositories = [
              `${dockerUsername}/${repositoryName}`,
              `${ghcrRegistry}/${owner}/${repositoryName}`,
              `${dockerUsername}/${repositoryName}-pro`,
              `${ghcrRegistry}/${owner}/${repositoryName}-pro`,
            ].map((repository) => repository.toLowerCase());

            let shouldRun = 'false';
            if (context.eventName === "push") {
              shouldRun = 'true';
            } else if (context.eventName === "pull_request") {
              const commitMsg = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha
              }).then(commit => commit.data.commit.message);
              if (commitMsg.includes("Run CI")) {
                shouldRun = 'true';
              }
            }

            core.setOutput('should-run', shouldRun);

            const shouldRelease = (context.eventName === "push" && context.ref.startsWith("refs/tags/")) ? 'true' : 'false';
            core.setOutput('should-release', shouldRelease);

            core.setOutput('image-names', imageRepositories.map((repository) => `name=${repository}`).join('\n'));
            core.setOutput('image-repositories', imageRepositories.join(','));

  create-release:
    needs:
      - pre-workflow-checks
    if: needs.pre-workflow-checks.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@031a6408a9ad7fa6dcda49b7222ab2b54110a680 # v5.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker-platform:
    needs:
      - pre-workflow-checks
    if: needs.pre-workflow-checks.outputs.should-run == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Describe version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Prepare platform
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to the ghcr container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to the docker hub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ${{ needs.pre-workflow-checks.outputs.image-names }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ needs.pre-workflow-checks.outputs.image-repositories }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            UNKEY_ROOT_KEY=${{ secrets.UNKEY_ROOT_KEY }}
            RYOT_VERSION=${{ steps.version.outputs.value }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-docker:
    needs:
      - pre-workflow-checks
      - build-docker-platform
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to the ghcr container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to the docker hub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ${{ needs.pre-workflow-checks.outputs.image-names }}
          tags: |
            type=ref,event=pr
            type=raw,value=develop,enable={{is_default_branch}}
            type=semver,pattern=v{{version}},enable=${{ needs.pre-workflow-checks.outputs.should-release == 'true' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ needs.pre-workflow-checks.outputs.should-release == 'true' }}
            type=semver,pattern=v{{major}},enable=${{ needs.pre-workflow-checks.outputs.should-release == 'true' }}
            type=raw,value=latest,enable=${{ needs.pre-workflow-checks.outputs.should-release == 'true' }}
            type=sha
      - name: Create manifest lists and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REPOSITORIES: ${{ needs.pre-workflow-checks.outputs.image-repositories }}
        run: |
          IFS=',' read -ra repositories <<< "${IMAGE_REPOSITORIES}"
          for repository in "${repositories[@]}"; do
            mapfile -t tags < <(jq -r --arg repository "${repository}" '.tags[] | select(startswith($repository + ":")) | "--tag=" + .' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
            sources=()
            for digest in *; do
              sources+=("${repository}@sha256:${digest}")
            done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          done

  upload-kodi-plugin:
    needs:
      - pre-workflow-checks
      - build-docker
    if: needs.pre-workflow-checks.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build plugin
        run: apps/kodi/ci/build-plugin.sh
      - name: Upload plugin to releases
        env:
          REF_NAME: ${{ github.ref_name }}
        run: gh release upload --clobber "${REF_NAME}" "tmp/script.ryot.zip"

  upload-browser-extensions:
    needs:
      - pre-workflow-checks
      - build-docker
    if: needs.pre-workflow-checks.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build browser extensions
        run: bun run turbo build --filter=@ryot-app/browser-extension
      - name: Upload browser extensions to releases
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload --clobber "${REF_NAME}" apps/browser-extension/dist/*.zip

  deploy-docs:
    needs:
      - pre-workflow-checks
      - build-docker
    if: needs.pre-workflow-checks.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build documentation
        run: bun run turbo build --filter=@ryot-app/docs
      - name: Push to deployment branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/docs/.vitepress/dist
          publish_branch: nf-docs
          force_orphan: true
