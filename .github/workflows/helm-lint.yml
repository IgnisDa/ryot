name: Helm Lint

on:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.2

      - name: helm lint
        # Provide the minimum required values so the guardrails pass and lint
        # exercises a real render.
        run: |
          helm lint helm/ryot \
            --set secret.adminAccessToken.value=ci-admin-token \
            --set postgres.auth.password=ci-postgres-password

      - name: helm template (render sanity)
        run: |
          helm template ryot helm/ryot \
            --set secret.adminAccessToken.value=ci-admin-token \
            --set postgres.auth.password=ci-postgres-password \
            > /dev/null
