name: Sandbox Sidecar

on:
  push:
    paths: &paths
      - "kernel/**"
      - "packages/**"
      - "plugins/**"
      - "apps/server/**"
      - "Dockerfile"
      - ".dockerignore"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/sandboxd.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TEST_DATABASE_URL: postgres://test_user:test_password@127.0.0.1:5432/test_db
      TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the sandbox test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: sandbox-test
          load: true
          tags: ryot-sandbox-test
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
      - name: Build the release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          load: true
          tags: ryot-image
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
      - name: Check the sidecar, launcher, and protocol fixtures
        if: matrix.arch == 'amd64'
        run: docker run --rm --user 1001 --workdir /app/kernel/sandboxd ryot-sandbox-test bun run check
      - name: Test the sidecar
        run: docker run --rm --user 1001 --workdir /app/kernel/sandboxd ryot-sandbox-test cargo test
      - name: Test the launcher under Docker defaults
        run: |
          docker run --rm --user 0 --workdir /app/kernel/sandboxd ryot-sandbox-test \
            cargo test --bin ryot-sandbox-launcher -- --test-threads=1
          docker run --rm --user 0 --workdir /app/kernel/sandboxd ryot-sandbox-test \
            cargo test --test launcher -- --ignored --test-threads=1
      - name: Test the kernel backend under Docker confinement
        run: >-
          docker run --rm --user 1001 --network host
          --env TEST_DATABASE_URL --env TEST_REDIS_URL
          --workdir /app/kernel/backend
          ryot-sandbox-test bun --bun run vitest run --no-file-parallelism
      - name: Test the sandbox SDK workflow
        run: >-
          docker run --rm --user 1001 --network host
          --workdir /app/packages/sandbox-sdk
          ryot-sandbox-test bun --bun run vitest run --no-file-parallelism tests/workflow.test.ts
      - name: Run all six confined sandbox keys in the release image
        run: docker run --rm --network none ryot-image bun run dist/prepare-sandbox-runtime.js
