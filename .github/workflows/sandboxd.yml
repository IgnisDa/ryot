name: Sandbox Sidecar

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      image-repositories:
        required: true
        type: string
      publish:
        required: true
        type: boolean
    secrets:
      DOCKER_TOKEN:
        required: false
      UNKEY_ROOT_KEY:
        required: false

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  DOCKER_USERNAME: ignisda

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TEST_DATABASE_URL: postgres://test_user:test_password@127.0.0.1:5432/test_db
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          ref: ${{ inputs.source-ref }}
      - name: Describe version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the sandbox test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: sandbox-test
          load: true
          tags: ryot-sandbox-test
          platforms: linux/${{ matrix.arch }}
          build-args: &build-args |
            UNKEY_ROOT_KEY=${{ inputs.publish && secrets.UNKEY_ROOT_KEY || '' }}
            RYOT_VERSION=${{ steps.version.outputs.value }}
          cache-from: &cache-from |
            type=gha,scope=sandbox-test-linux-${{ matrix.arch }}
            type=gha,scope=runner-linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sandbox-test-linux-${{ matrix.arch }}
      - name: Build the release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          load: true
          tags: ryot-image
          platforms: linux/${{ matrix.arch }}
          build-args: *build-args
          labels: &labels |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source-ref }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: *cache-from
          cache-to: type=gha,mode=max,scope=runner-linux-${{ matrix.arch }}
      - name: Check the sidecar, launcher, and protocol fixtures
        if: matrix.arch == 'amd64'
        run: docker run --rm --user 1001 --workdir /app/kernel/sandbox ryot-sandbox-test bun run check
      - name: Test the shared test infrastructure
        run: >-
          docker run --rm --user 1001 --workdir /app
          ryot-sandbox-test bun turbo --filter=@ryot-app/testing test
      - name: Test the sidecar
        run: docker run --rm --user 1001 --workdir /app/kernel/sandbox/native ryot-sandbox-test cargo test
      - name: Test the launcher under Docker defaults
        run: |
          docker run --rm --user 0 --workdir /app/kernel/sandbox/native ryot-sandbox-test \
            cargo test --bin ryot-sandbox-launcher -- --test-threads=1
          docker run --rm --user 0 --workdir /app/kernel/sandbox/native ryot-sandbox-test \
            cargo test --test launcher -- --ignored --test-threads=1
      - name: Test the sandbox host under Docker confinement
        run: >-
          docker run --rm --user 1001 --network host
          --workdir /app/kernel/sandbox
          ryot-sandbox-test bun ./test.ts --parallel=1
      - name: Test the kernel backend under Docker confinement
        run: >-
          docker run --rm --user 1001 --network host
          --env TEST_DATABASE_URL
          --workdir /app/kernel/backend
          ryot-sandbox-test bun ./test.ts --parallel=1
      - name: Repeat the backup memory contract in fresh processes
        run: >-
          docker run --rm --user 1001 --network host
          --env TEST_DATABASE_URL
          --workdir /app
          ryot-sandbox-test bun turbo --filter=@ryot-app/kernel-backend test:memory
      - name: Test the sandbox SDK workflow
        run: >-
          docker run --rm --user 1001 --network host
          --workdir /app/packages/plugin-backend-sdk
          ryot-sandbox-test bun test --isolate tests/workflow.test.ts
      - name: Run all six confined sandbox keys in the release image
        run: docker run --rm --network none ryot-image bun run dist/prepare-sandbox-runtime.js
      - name: Log in to the ghcr container registry
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to the docker hub container registry
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Publish the validated build by digest
        if: inputs.publish
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          platforms: linux/${{ matrix.arch }}
          build-args: *build-args
          labels: *labels
          tags: ${{ inputs.image-repositories }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      - name: Verify the published image matches the tested image
        if: inputs.publish
        env:
          IMAGE_REPOSITORIES: ${{ inputs.image-repositories }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image="${IMAGE_REPOSITORIES%%,*}@${DIGEST}"
          docker image inspect ryot-image | jq -S '.[0] | {Architecture, Os, Config, RootFS}' > "$RUNNER_TEMP/tested-image.json"
          docker pull "$image"
          docker image inspect "$image" | jq -S '.[0] | {Architecture, Os, Config, RootFS}' > "$RUNNER_TEMP/published-image.json"
          diff -u "$RUNNER_TEMP/tested-image.json" "$RUNNER_TEMP/published-image.json"
      - name: Export digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
