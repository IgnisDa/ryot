name: Sandbox Sidecar

on:
  workflow_call:
    inputs:
      build-version:
        required: true
        type: string
      run-tests:
        required: true
        type: boolean
      run-kubernetes:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TEST_DATABASE_URL: postgres://test_user:test_password@127.0.0.1:5432/test_db
    services:
      postgres:
        image: ${{ inputs.run-tests && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: inputs.run-tests
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the sandbox test image
        if: inputs.run-tests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: sandbox-test
          load: true
          tags: ryot-sandbox-test
          platforms: linux/${{ matrix.arch }}
          build-args: RYOT_VERSION=${{ inputs.build-version }}
          cache-from: |
            ${{ github.event_name == 'pull_request' && format('type=gha,scope=sandbox-test-linux-{0}', matrix.arch) || '' }}
            ${{ github.event_name == 'pull_request' && format('type=gha,scope=runner-linux-{0}', matrix.arch) || '' }}
          cache-to: ${{ github.event_name == 'pull_request' && format('type=gha,mode=max,ignore-error=true,scope=sandbox-test-linux-{0}', matrix.arch) || '' }}
      - name: Check the sidecar, launcher, and protocol fixtures
        if: inputs.run-tests && matrix.arch == 'amd64'
        run: docker run --rm --user 1001 --workdir /app/kernel/sandbox ryot-sandbox-test bun run check
      - name: Test the shared test infrastructure
        if: inputs.run-tests
        run: >-
          docker run --rm --user 1001 --workdir /app
          ryot-sandbox-test bun turbo --filter=@ryot-app/testing test
      - name: Test the sidecar
        if: inputs.run-tests
        run: docker run --rm --user 1001 --workdir /app/kernel/sandbox/native ryot-sandbox-test cargo test
      - name: Test the launcher under Docker defaults
        if: inputs.run-tests
        run: |
          docker run --rm --user 0 --workdir /app/kernel/sandbox/native ryot-sandbox-test \
            cargo test --bin ryot-sandbox-launcher -- --test-threads=1
          docker run --rm --user 0 --workdir /app/kernel/sandbox/native ryot-sandbox-test \
            cargo test --test launcher -- --ignored --test-threads=1
      - name: Test the sandbox host under Docker confinement
        if: inputs.run-tests
        run: >-
          docker run --rm --user 1001 --network host
          --workdir /app/kernel/sandbox
          ryot-sandbox-test bun ./test.ts --parallel=1
      - name: Test the kernel backend under Docker confinement
        if: inputs.run-tests
        run: >-
          docker run --rm --user 1001 --network host
          --env TEST_DATABASE_URL
          --workdir /app/kernel/backend
          ryot-sandbox-test bun ./test.ts --parallel=1
      - name: Repeat the backup memory contract in fresh processes
        if: inputs.run-tests
        run: >-
          docker run --rm --user 1001 --network host
          --env TEST_DATABASE_URL
          --workdir /app
          ryot-sandbox-test bun turbo --filter=@ryot-app/kernel-backend test:memory
      - name: Test the sandbox SDK workflow
        if: inputs.run-tests
        run: >-
          docker run --rm --user 1001 --network host
          --workdir /app/packages/plugin-backend-sdk
          ryot-sandbox-test bun test --isolate tests/workflow.test.ts
      - name: Download the tested amd64 image
        if: inputs.run-kubernetes && matrix.arch == 'amd64'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ryot-image-${{ github.sha }}-amd64.tar
          path: ${{ runner.temp }}/candidate
          skip-decompress: true
      - name: Load the tested image
        if: inputs.run-kubernetes && matrix.arch == 'amd64'
        run: bash ci/images/load.sh "$RUNNER_TEMP/candidate/ryot-image-$GITHUB_SHA-amd64.tar"
      - name: Set up Helm
        if: inputs.run-kubernetes && matrix.arch == 'amd64'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.2
      - name: Create kind cluster
        if: inputs.run-kubernetes && matrix.arch == 'amd64'
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: ryot-ci
      - name: Validate the candidate under Kubernetes
        if: inputs.run-kubernetes && matrix.arch == 'amd64'
        run: bash ci/helm/acceptance.sh
      - name: Kubernetes diagnostics on failure
        if: failure() && inputs.run-kubernetes && matrix.arch == 'amd64'
        run: |
          kubectl get pods,pvc -n ryot -o wide || true
          kubectl describe pods -n ryot || true
          kubectl logs -n ryot -l app.kubernetes.io/name=ryot --tail=200 --all-containers || true
      - name: Remove the acceptance cluster
        if: always() && inputs.run-kubernetes && matrix.arch == 'amd64'
        run: kind delete cluster --name ryot-ci
