name: Helm CI

on:
  pull_request:
    paths:
      - "ci/helm/**"
      - ".github/workflows/helm-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs when a PR is updated in quick succession.
  group: helm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.2

      - name: helm lint
        # Provide the minimum required values so the guardrails pass and lint
        # exercises a real render.
        run: |
          helm lint ci/helm/ryot \
            --set secret.adminAccessToken.value=ci-admin-token \
            --set postgres.auth.password=ci-postgres-password

      - name: helm template (render sanity)
        run: |
          helm template ryot ci/helm/ryot \
            --set secret.adminAccessToken.value=ci-admin-token \
            --set postgres.auth.password=ci-postgres-password \
            > /dev/null

  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.2

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Run helm-unittest (guardrails + rendering + DATABASE_URL)
        # Asserts every validation guardrail fails as expected, that the happy
        # paths render, and that DATABASE_URL is composed correctly in all modes.
        run: helm unittest --strict ci/helm/ryot

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.2

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Install the chart (bundled PostgreSQL)
        # --wait blocks until the Deployment and StatefulSet are Ready, so the
        # subsequent `helm test` runs against a live, healthy release.
        run: |
          helm install ryot ci/helm/ryot \
            --namespace ryot --create-namespace \
            --set secret.adminAccessToken.value=ci-admin-token \
            --set postgres.auth.password=ci-postgres-password \
            --set config.frontendUrl=http://ryot.ci.local \
            --wait --timeout 10m

      - name: Run helm test (http + DATABASE_URL connectivity)
        run: helm test ryot --namespace ryot --logs

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n ryot -o wide || true
          kubectl describe pods -n ryot || true
          kubectl logs -n ryot -l app.kubernetes.io/name=ryot --tail=200 --all-containers || true
          kubectl logs -n ryot -l app.kubernetes.io/component=database --tail=200 || true
