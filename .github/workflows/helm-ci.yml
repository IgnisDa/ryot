name: Helm CI

on:
  pull_request:
    paths:
      - "ci/helm/**"
      - ".github/workflows/helm-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.2

      - name: helm lint
        run: |
          helm lint ci/helm/ryot \
            --set secret.adminAccessToken.value=ci-admin-token \
            --set postgres.auth.password=ci-postgres-password

      - name: helm template (render sanity)
        run: |
          helm template ryot ci/helm/ryot \
            --set secret.adminAccessToken.value=ci-admin-token \
            --set postgres.auth.password=ci-postgres-password \
            > /dev/null

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1

      - name: Run helm-unittest (guardrails + rendering + DATABASE_URL)
        run: helm unittest --strict ci/helm/ryot

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.2

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Install the chart (bundled PostgreSQL)
        run: |
          helm install ryot ci/helm/ryot \
            --namespace ryot --create-namespace \
            --set secret.adminAccessToken.value=ci-admin-token \
            --set postgres.auth.password=ci-postgres-password \
            --set config.frontendUrl=http://ryot.ci.local \
            --wait --timeout 10m

      - name: Run helm test (HTTP + database connectivity)
        run: helm test ryot --namespace ryot --logs

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n ryot -o wide || true
          kubectl describe pods -n ryot || true
          kubectl logs -n ryot -l app.kubernetes.io/name=ryot --tail=200 --all-containers || true
          kubectl logs -n ryot -l app.kubernetes.io/component=database --tail=200 || true
