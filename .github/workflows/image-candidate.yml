name: Docker Image Candidate

on:
  workflow_call:
    inputs:
      build-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify the candidate
        id: image
        run: echo "archive=$RUNNER_TEMP/ryot-image-$GITHUB_SHA-${{ matrix.arch }}.tar" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ steps.image.outputs.archive }}
          build-args: RYOT_VERSION=${{ inputs.build-version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.build-version }}
          cache-from: |
            ${{ github.event_name == 'pull_request' && format('type=gha,scope=sandbox-test-linux-{0}', matrix.arch) || '' }}
            ${{ github.event_name == 'pull_request' && format('type=gha,scope=runner-linux-{0}', matrix.arch) || '' }}
          cache-to: ${{ github.event_name == 'pull_request' && format('type=gha,mode=max,ignore-error=true,scope=runner-linux-{0}', matrix.arch) || '' }}
      - name: Smoke-test the exported image under Docker confinement
        env:
          IMAGE: ${{ steps.image.outputs.archive }}
        run: |
          bash ci/images/load.sh "$IMAGE"
          docker run --rm --network none ryot-image bun run dist/prepare-sandbox-runtime.js
      - name: Upload the tested candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.image.outputs.archive }}
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 3
