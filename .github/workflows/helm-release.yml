name: Helm Release

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: helm-release
  queue: max

jobs:
  release:
    if: github.ref_protected && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    cache-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.2

      - name: Set chart version from the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Releasing chart version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          export VERSION
          yq -i '.version = strenv(VERSION) | .appVersion = strenv(TAG)' ci/helm/ryot/Chart.yaml

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.RELEASE_GHCR_USERNAME }}
          password: ${{ secrets.RELEASE_GHCR_TOKEN }}

      - name: Package and push chart
        run: |
          helm package ci/helm/ryot
          helm push "ryot-${VERSION}.tgz" oci://ghcr.io/ignisda/charts
