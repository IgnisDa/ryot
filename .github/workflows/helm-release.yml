name: Helm Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: helm-release
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.2

      - name: Set chart version from the release tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Releasing chart version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          yq -i ".version = \"$VERSION\"" ci/helm/ryot/Chart.yaml

      - name: Warn on chart/appVersion major mismatch
        run: |
          CHART_MAJOR="${VERSION%%.*}"
          APP_VERSION="$(yq '.appVersion' ci/helm/ryot/Chart.yaml)"
          APP_MAJOR="${APP_VERSION#v}"
          APP_MAJOR="${APP_MAJOR%%.*}"
          if [ "$CHART_MAJOR" != "$APP_MAJOR" ]; then
            echo "::warning title=Chart/appVersion major mismatch::Chart version $VERSION (major $CHART_MAJOR) is on a different major than appVersion $APP_VERSION (major $APP_MAJOR). Confirm the chart targets the intended Ryot release."
          else
            echo "Chart major ($CHART_MAJOR) matches appVersion major ($APP_MAJOR)."
          fi

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        run: |
          helm package ci/helm/ryot
          helm push "ryot-${VERSION}.tgz" oci://ghcr.io/ignisda/charts
