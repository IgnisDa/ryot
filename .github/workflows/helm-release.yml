name: Helm Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # Serialize releases; never cancel an in-progress publish (queue instead).
  group: helm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The chart is pushed to GHCR as an OCI artifact.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.2

      - name: Set chart version from the release tag
        # The git release number drives the chart version. Helm requires a
        # SemVer2 version, so the leading "v" (if any) is stripped.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Releasing chart version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          yq -i ".version = \"$VERSION\"" ci/helm/ryot/Chart.yaml

      - name: Warn on chart/appVersion major mismatch
        run: |
          CHART_MAJOR="${VERSION%%.*}"
          APP_VERSION="$(yq '.appVersion' ci/helm/ryot/Chart.yaml)"
          APP_MAJOR="${APP_VERSION#v}"
          APP_MAJOR="${APP_MAJOR%%.*}"
          if [ "$CHART_MAJOR" != "$APP_MAJOR" ]; then
            echo "::warning title=Chart/appVersion major mismatch::Chart version $VERSION (major $CHART_MAJOR) is on a different major than appVersion $APP_VERSION (major $APP_MAJOR). Confirm the chart targets the intended Ryot release."
          else
            echo "Chart major ($CHART_MAJOR) matches appVersion major ($APP_MAJOR)."
          fi

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        run: |
          helm package ci/helm/ryot
          helm push "ryot-${VERSION}.tgz" oci://ghcr.io/ignisda/charts
