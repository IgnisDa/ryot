name: Helm Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.2

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set chart version from the release tag
        # The git release number drives the chart version. Helm requires a
        # SemVer2 version, so the leading "v" (if any) is stripped.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Releasing chart version: $VERSION"
          yq -i ".version = \"$VERSION\"" helm/ryot/Chart.yaml

      - name: Warn on chart/appVersion major mismatch
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          CHART_MAJOR="${VERSION%%.*}"
          APP_VERSION="$(yq '.appVersion' helm/ryot/Chart.yaml)"
          APP_MAJOR="${APP_VERSION#v}"
          APP_MAJOR="${APP_MAJOR%%.*}"
          if [ "$CHART_MAJOR" != "$APP_MAJOR" ]; then
            echo "::warning title=Chart/appVersion major mismatch::Chart version $VERSION (major $CHART_MAJOR) is on a different major than appVersion $APP_VERSION (major $APP_MAJOR). Confirm the chart targets the intended Ryot release."
          else
            echo "Chart major ($CHART_MAJOR) matches appVersion major ($APP_MAJOR)."
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: helm
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
