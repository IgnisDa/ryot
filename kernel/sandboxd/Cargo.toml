[package]
name = "ryot-sandboxd"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "ryot-sandboxd"

[dependencies]
base64 = "0.22"
deno_core = { version = "=0.412.0", default-features = false, features = ["v8", "reactor-tokio", "v8_use_custom_libcxx"] }
deno_error = "=0.7.1"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[build-dependencies]
deno_core = { version = "=0.412.0", default-features = false, features = ["v8", "reactor-tokio", "v8_use_custom_libcxx"] }
deno_error = "=0.7.1"
getrandom = "0.3"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
url = "2"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 4

[profile.dev.package.base64]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.test]
panic = "abort"

[[bench]]
name = "noop"
path = "bench/noop.rs"
harness = false
